# Two-machine setup: publishes the api and web app on this host's network so a reverse proxy on
# another machine (fronted by its own Cloudflare Tunnel) can reach them. Use with
# `npm run prod:lan -- <compose args>`. Postgres stays unpublished. Override the host ports with
# API_PORT / WEB_PORT in .env.production when 3100 or 8080 is taken.
services:
  api:
    ports:
      - '${API_PORT:-3100}:3100'
  web:
    ports:
      - '${WEB_PORT:-8080}:80'
